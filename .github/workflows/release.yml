name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const version = require('./package.json').version; const tag = process.env.RELEASE_TAG.replace(/^v/, ''); if (tag !== version) { console.error('Tag ' + tag + ' does not match package version ' + version); process.exit(1); }"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Type-check
        run: npm run typecheck

      - name: Test database
        run: npm run test:database

      - name: Test OCR
        run: npm run test:ocr

      - name: Test mobile receipt transfer
        run: npm run test:mobile-receipt-transfer

      - name: Build the NSIS installer
        run: npm run dist

      - name: Test packaged OCR
        run: npm run test:packaged-ocr

      - name: Publish installer and updater metadata
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
